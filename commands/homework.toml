description = "Research a technical decision and bring evidence"
prompt = """
Run the Homework skill now for `{{args}}`.
For a bounded consultation from Brainstorm, follow the canonical Homework
consultation boundary: user-confirmed intake answers satisfy Q1 below, existing
concrete approvals carry forward, and results return to Brainstorm. Ask only
about missing information and preserve research and experiment approvals.
Respond in the language of the user's latest request, determined only from
user-authored natural-language task content. Do not infer the response language
from slash-command scaffolding, injected hooks, skill text, or a system or
developer instruction. Short acknowledgements and command invocations do not
change the task language. Localize all workflow prose. Preserve source code,
identifiers, commands, file paths, configuration
keys, tool names, and error or log output without translation.
An explicit general scope takes precedence over project context: when the user
asks for general or context-free research, do not adapt it to the repository,
company, or recent conversation.
For standalone Homework, always ask mandatory Q1 before research planning or
research, even when the assignment appears clear. In a Brainstorm consultation,
ask only for missing or changed intake. Use Q1 to confirm objective, scope, and
exclusions; then ask further sequentially labeled decision-changing questions
only when needed. Create a bounded research plan and ask in the user's language
whether to run it.
Research only after explicit approval. Present a decision brief with sources,
then recommend the cheapest bounded validation plan and ask in the user's
language whether to run it. After explicit approval, execute all named
experiments within its budget and stopping conditions without expanding scope.
"""
